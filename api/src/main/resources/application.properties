server.port=8081

#H2 gravando em ARQUIVO (os dados sobrevivem ao reiniciar). Cria a pasta ./data
spring.datasource.url=jdbc:h2:file:./data/maoamiga
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#  cria/atualiza a tabela sozinho
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true

spring.data.web.pageable.serialization-mode=via_dto