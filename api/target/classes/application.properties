server.port=8081

# Banco H2 em memória: é recriado (e recarregado pelo DataLoader) toda vez que a API sobe
spring.datasource.url=jdbc:h2:mem:maoamiga
spring.jpa.hibernate.ddl-auto=create-drop

# Paginação: 20 por página por padrão e no máximo 50 (size maior que 50 vira 50)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
